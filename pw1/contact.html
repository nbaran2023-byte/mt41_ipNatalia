<body>
    <header>
        <h1>Контакти:</h1>
        <p>Зв'яжіться з нами:</p>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>

    <main>
  <form method="post">

    <label for="name">Ім'я:</label>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="Введіть ваше ім'я"
        required
    >

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="example@gmail.com"
        required
    >

    <label for="subject">Тема повідомлення:</label>
    <input
        type="text"
        id="subject"
        name="subject"
        placeholder="Тема"
    >

    <label for="message">Повідомлення:</label>

    <textarea
        id="message"
        name="message"
        placeholder="Напишіть ваше повідомлення">
    </textarea>

    <br><br>

    <button type="submit">
        Надіслати
    </button>

</form>

</main>

<footer>
    <p>© 2026 Nataliia Adventures Blog</p>
</footer>

</body>
